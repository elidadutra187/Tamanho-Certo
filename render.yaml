services:
  - type: web
    name: tamanho-certo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: NUVEMSHOP_CLIENT_ID
        sync: false
      - key: NUVEMSHOP_CLIENT_SECRET
        sync: false
      - key: NUVEMSHOP_APP_SCOPES
        value: read_products,write_products
      - key: NUVEMSHOP_USER_AGENT
        value: Tamanho Certo (seu-email@exemplo.com)
      - key: NUVEMSHOP_API_VERSION
        value: 2025-03
      - key: NUVEMSHOP_REQUEST_DELAY_MS
        value: "900"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_SECRET
        sync: false
      - key: PORT
        value: 10000
